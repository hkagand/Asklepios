# Expected medication reconciliation findings per patient. Check with: python -m evals --meds
#
# Uses the anchor and seed in gold.toml. For each patient, "findings" lists the discrepancies that must be found:
#   drug  a word of the drug's name, matched like gold.toml mentions
#   kind  dose_differs, stopped_in_note, not_ordered (a drug the notes mention and no order lists) or plan
# Any other discrepancy counts as a false alarm. not_mentioned (an active order no recent note names) is shown for
# information and not checked. Every cohort patient is listed.

[[patient]]
id = "p-2041"
findings = []

[[patient]]
id = "p-1001"
findings = []

[[patient]]
id = "p-1002"
findings = []

