# Expected surgical history per patient. Check with: python -m evals --surgery
#
# Uses the anchor and seed in gold.toml. For each patient:
#   operations   each operation that must be listed. "match" is a phrase from its name, matched like gold.toml
#                mentions. Optional checks: year, region (abdomen, chest, head_neck, spine_limbs, other), approach,
#                implant (a phrase), only_in_notes (true when no Procedure record exists), years_differ (the years the
#                sources give when they disagree), sources (source kinds that must all be among its sources:
#                "procedure", "note", "report").
#   none_stated  true when a note says the patient has had no operations.
# Every listed operation that no expectation matches counts as a false alarm, so a patient with no operations
# expected must have none listed. Planned operations ("laparoscopic cholecystectomy", "possible conversion to
# surgery", "port-a-cath insertion" in a plan) and family history must not be listed.
# Every cohort patient is listed.

[[patient]]
id = "p-2041"
operations = [
  # In the oncology consultation only.
  { match = "cholecystectomy", year = 2012, region = "abdomen", approach = "laparoscopic", only_in_notes = true },
  # "Port-a-cath inserted on ..." in a later note; the earlier plan line is not an operation.
  { match = "port", region = "chest", only_in_notes = true },
]

