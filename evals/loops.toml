# Expected open loops per patient. Check with: python -m evals --loops
#
# Uses the anchor and seed in gold.toml. For each patient:
#   items  plan items or orders that must be found with this status. "match" is a phrase from the quoted plan line
#          (or the order name), matched like gold.toml mentions.
# Every open item (missing, overdue, not_ordered, no_trace) that no expectation matches counts as a false alarm, so a
# patient listed with no open expectations must have no open items at all. Every cohort patient is listed.
#
# Statuses: missing, overdue, not_ordered, no_trace, pending, conditional, done (see agent/loops.py)

[[patient]]
id = "p-2041"
items = [
  { match = "restaging ct", status = "overdue" },
  { match = "cea", status = "overdue" },
  { match = "tumour board", status = "no_trace" },
  { match = "hold maintenance chemotherapy", status = "done" },
  { match = "clinic review", status = "pending" },
  { match = "further imaging", status = "conditional" },
  { match = "ferrous sulfate", status = "done" },
  { match = "gastroenterology", status = "done" },
]

