# Expected open loops per patient. Check with: python -m evals --loops
#
# Uses the anchor and seed in gold.toml. For each patient:
#   items  plan items or orders that must be found with this status, or with one of a list of statuses. "match" is a
#          phrase from the quoted plan line (or the order name), matched like gold.toml mentions.
#   marks  optional review or communication marks to add to the record first, as a clinician would through the panel:
#          { kind = "review" | "communication", about = [refs], by = practitioner id, medium = "phone" | ... }
# Every open item (missing, dose_mismatch, overdue, to_review, not_ordered, no_trace, to_inform) that no expectation
# matches counts as a false alarm, so a patient listed with no open expectations must have no open items at all.
# Every cohort patient is listed.
#
# Statuses: missing, dose_mismatch, overdue, to_review, not_ordered, no_trace, to_inform, pending, conditional, done
# (see agent/loops.py). The cohort has no review marks, so a result no later note quotes is to_review.

[[patient]]
id = "p-2041"
items = [
  { match = "restaging ct", status = "overdue" },
  { match = "cea", status = "overdue" },
  { match = "tumour board", status = "no_trace" },
  { match = "hold maintenance chemotherapy", status = "done" },
  { match = "clinic review", status = "pending" },
  { match = "further imaging", status = ["conditional", "done"] },
  { match = "ferrous sulfate", status = "done" },
  { match = "gastroenterology", status = "done" },
]

[[patient]]
id = "p-1001"
# Both results reviewed, the patient not yet told.
marks = [{ kind = "review", about = ["DiagnosticReport/dr-p-1001-022", "DiagnosticReport/dr-p-1001-023"], by = "pr-aydin" }]
items = [
  { match = "follow-up", status = "pending" },
  { match = "hba1c", status = "to_inform" },
]

