# Gold questions for ASKlepios. Run with: python -m evals   (check this file with: python -m evals --lint)
#
# The cohort is rebuilt from the generator with this anchor and seed, and "today" is the anchor, so every
# expectation below holds on any day. Changing either means re-checking every case.
anchor = "2026-10-23"
seed = 2041

# Each [[case]]:
#   id, patient, category, question
#   expected  the reference answer, for the reader and for --judge
#   history   earlier questions asked in the same chat first (optional)
#   mentions  every group must appear in the answer; a group is one phrase or a list of alternatives.
#             Matching ignores case, accents and British/American spelling, and works on whole words;
#             a trailing * matches any word ending ("neuropath*").
#   cites     every group must be cited by at least one of its ids (only ids the assistant was shown count)
#   avoid     phrases that must not appear
#   language  "en" or "tr"; by default, the language the question is written in
# Text in statements the panel hides (cites only ids never shown) does not count.
#
# Categories: lookup, medication, labs, pending, documents, compare, briefing, absent, safety, followup, isolation,
# loops (plans in notes checked against the record; see also loops.toml), medications (see also meds.toml)

